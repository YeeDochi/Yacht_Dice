<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>game_hub/Yacht_Dice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="https://cdn.simpleicons.org/github/ffffff" type="image/svg+xml">
    <style>
        /* =========================================
           1. 기본 레이아웃 & 공통 스타일 (PC 기준)
           ========================================= */
        .game-layout { display: flex; gap: 20px; align-items: flex-start; }

        /* [신규] 우측 사이드바 전체 래퍼 */
        #sidebar-wrapper {
            display: flex; flex-direction: column;
            height: 600px; flex: 1; min-width: 300px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--box-bg);
            overflow: hidden;
        }

        /* 플레이어 목록 박스 */
        #player-list-box {
            flex: 0 0 150px;
            display: flex; flex-direction: column;
            border-bottom: 1px solid var(--border-color);
            background: var(--box-bg);
        }
        #user-list-area { flex: 1; overflow-y: auto; background: var(--box-bg); }

        /* 채팅 패널 */
        #right-panel {
            flex: 1; display: flex; flex-direction: column; min-height: 0;
            background: var(--box-bg); border: none; margin: 0; border-radius: 0;
        }


        /* 상단 정보바 (제목 + 버튼) */
        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 기타 기존 스타일 유지 */
        .room-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .game-stage { border: 1px solid var(--border-color); background: var(--box-bg); width: 600px; height: 600px; position: relative; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }

        #dice-section { flex: 0 0 130px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
        .dice-wrap { display: flex; gap: 10px; }
        .dice { width: 50px; height: 50px; background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 8px; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; }
        .dice.kept { background: #ffec99; border-color: #ffd43b; color: #333; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        @keyframes roll-anim { 0% { transform: rotate(0deg) translateY(0); } 25% { transform: rotate(10deg) translateY(-2px); } 50% { transform: rotate(-10deg) translateY(0); } 75% { transform: rotate(5deg) translateY(-2px); } 100% { transform: rotate(0deg) translateY(0); } }
        .dice.rolling { animation: roll-anim 0.2s linear infinite; background-color: var(--row-hover); color: var(--text-secondary); }

        #score-section { flex: 1; overflow-y: auto; padding: 0; }
        .score-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .score-table th { background: var(--bg-header); padding: 10px 16px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .score-table td { padding: 6px 16px; border-bottom: 1px solid var(--border-color); height: 28px; }
        .category-name { font-weight: 600; background-color: var(--bg-header); border-right: 1px solid var(--border-color); width: 40%; }
        .score-cell { cursor: pointer; text-align: center; } .score-cell.filled { background: var(--bg-header); cursor: default; }
        .summary-row td { background-color: var(--row-hover); font-weight: bold; color: var(--link-color); border-top: 2px solid var(--border-color); }
        .total-row td { background-color: var(--text-primary); color: var(--box-bg); border-top: 2px solid var(--border-color); }
        .score-cell.score-preview {
            color: var(--text-secondary);
            opacity: 0.5 !important;
            font-weight: normal;
        }
        .user-row { padding: 10px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .user-row.active { background: var(--row-hover); border-left: 3px solid var(--status-online); }

        #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; }
        .msg-input-box { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 5px; background: var(--bg-header); }
        .msg-input-box input { flex: 1; width: auto; }
        .panel-header { padding: 8px 16px; background: var(--bg-header); border-bottom: 1px solid var(--border-color); font-size: 12px; font-weight: 600; color: var(--text-secondary); }

        /* PC에서는 모바일 버튼 숨김 */
        #mobile-chat-btn, #mobile-chat-close-btn { display: none !important;  }

        /* =========================================
           2. 모바일 반응형 (UNO 스타일 참조)
           ========================================= */
        @media (max-width: 768px) {
            /* [헤더 최적화] 패딩 줄임 */
            header { padding: 8px 10px !important; gap: 5px !important; }
            .repo-breadcrumb .user-name,
            .repo-breadcrumb .repo-name {
                font-size: 14px !important; /* 기존(보통 16~18px)보다 작게 */
            }
            /* [Dark/Light 버튼] 글자가 너무 기므로 아이콘으로 대체하여 공간 확보 */
            header .theme-btn {
                font-size: 0 !important; /* 글자 숨김 */
                width: 32px; height: 32px;
                padding: 0 !important;
                display: flex; align-items: center; justify-content: center;
            }
            header .theme-btn::after {
                content: "🌓"; /* 달/해 아이콘 표시 */
                font-size: 16px;
                color: var(--text-primary);
            }

            /* 닉네임 줄바꿈 방지 및 말줄임 */
            #loggedInArea { gap: 5px; }
            #loggedInArea span {
                white-space: nowrap; font-size: 12px !important;
                max-width: 70px; overflow: hidden; text-overflow: ellipsis;
                display: inline-block; vertical-align: middle;
            }

            /* 컨테이너 좌우 여백 최소화 */
            .container { padding: 0 5px !important; width: 100%; box-sizing: border-box; }
            body, html { overflow-x: hidden; width: 100%; }

            /* [방 목록] 글자 깨짐 해결 */
            #lobby-screen .box > div:last-child > div:first-child {
                display: flex !important;
                justify-content: space-between !important;
                align-items: center !important;
            }
            #lobby-screen .box > div:last-child > div:first-child span {
                white-space: nowrap !important; /* 줄바꿈 금지 */
                flex-shrink: 0; /* 너비 줄어듦 방지 */
            }

            /* 게임 정보바 버튼 겹침 방지 */
            .game-meta {
                flex-direction: column !important; /* 가로 -> 세로 변경 */
                align-items: flex-start !important;
                gap: 10px !important;
            }
            /* 버튼 그룹도 꽉 차게 */
            .game-meta > div:last-child {
                width: 100%;
                display: flex;
                justify-content: flex-end; /* 버튼 오른쪽 정렬 */
                gap: 10px;
            }
            .game-meta button {
                flex: 1; /* 버튼들을 균등하게 키워서 터치하기 편하게 */
            }


            /* 레이아웃 세로 배치 */
            .game-layout { flex-direction: column !important; align-items: center; gap: 15px; }
            .game-stage { width: 100%; max-width: 100%; min-height: auto; }

            /* 사이드바 래퍼 투명화 */
            #sidebar-wrapper { height: auto; border: none; background: transparent; width: 100%; gap: 10px; overflow: visible; }

            /* 플레이어 목록 */
            #player-list-box { height: 150px; border: 1px solid var(--border-color); border-radius: 6px; width: 100%; }

            /* 채팅창 팝업 */
            #right-panel {
                display: none; /* 숨김 */
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                z-index: 9999; margin: 0; background-color: var(--box-bg);
            }
            #right-panel.active { display: flex !important; }

            /* 모바일 채팅 버튼 */
            #mobile-chat-btn {
                display: flex !important; position: fixed; bottom: 20px; right: 20px;
                width: 50px; height: 50px; border-radius: 50%;
                background-color: var(--link-color); color: white;
                font-size: 24px; justify-content: center; align-items: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9900;
                border: none; cursor: pointer;
            }
            #mobile-chat-close-btn {
                display: block !important; background: none; border: none; font-size: 1.2em;
                cursor: pointer; color: var(--text-primary); padding: 5px;
            }

            /* 기타 요소 최적화 */
            .dice { width: 40px; height: 40px; font-size: 20px; }
            .box { width: 100% !important; margin: 0 auto; }
            #lobby-screen .box > div:nth-child(2) { flex-direction: column !important; gap: 8px !important; }
            #roomNameInput, #lobby-screen button { width: 100% !important; }
        }
    </style>
</head>
<body>

<header>
    <div class="repo-breadcrumb">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" width="30" style="border-radius:50%; opacity:1;">
        <a href="/" class="user-name">game-hub</a>
        <span style="color:var(--text-primary)">/</span>
        <a href="#" class="repo-name">Yacht_Dice</a>
        <span class="badge">Public</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; margin-left: auto;">
    <div id="loggedInArea" class="hidden" style="display: flex; align-items: center; gap: 8px;">
        <span style="color: var(--text-primary); font-size: 14px;">👋 <b id="userNickname">User</b></span>
        <button class="btn-default" onclick="Core.logout()" style="padding: 4px 8px; font-size: 12px;">Sign out</button>
    </div>
        <button class="theme-btn" onclick="Core.toggleTheme()">Dark/Light</button>
    </div>
</header>

<div id="login-screen" class="container" style="max-width: 400px; margin-top: 50px;">
    <div class="box">
        <div class="box-header">게임 입장</div>
        <div style="padding: 20px;">
            <label>닉네임</label>
            <input type="text" id="nicknameInput" placeholder="닉네임 입력" onkeypress="if(event.key==='Enter') Core.login()">
            <button class="btn-primary" onclick="Core.login()" style="width:100%; margin-top:20px;">입장하기</button>
        </div>
    </div>
</div>

<div id="lobby-screen" class="container hidden">
    <div class="box">
        <div class="box-header">대기실 <span id="welcome-msg"></span></div>
        <div style="padding: 16px; display:flex; gap:10px;">
            <input type="text" id="roomNameInput" placeholder="방 제목" value="새로운 게임방" style="flex:2;">
            <button class="btn-primary" onclick="Core.createRoom()">방 만들기</button>
            <button class="btn-default" onclick="Core.showRanking()">🏆 랭킹</button>
        </div>
        <div style="max-height: 400px; overflow-y: auto;">
            <div style="padding: 10px 16px; background:var(--bg-header); border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between;">
                <span>방 목록</span>
                <button class="btn-default" onclick="Core.loadRooms()" style="font-size:12px;">새로고침</button>
            </div>
            <ul id="room-list" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>
    </div>
</div>

<div id="game-screen" class="container hidden">
    <button id="mobile-chat-btn" onclick="Core.toggleChat()">💬</button>
<div class="game-meta" ><!--    style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">-->
        <div>
            <strong id="room-title-text" style="font-size: 18px;">방 제목</strong>
            <span id="game-status" class="badge">대기 중</span>
            <span id="room-user-count" class="badge" style="margin-left: 5px; color: var(--text-secondary);"></span>
        </div>
        <div>
            <button id="startBtn" class="btn-primary" onclick="Core.startGame()">게임 시작</button>
            <button class="btn-danger" onclick="Core.exitRoom()">나가기</button>
        </div>
    </div>

    <div class="game-layout">
        <div id="game-stage" class="game-stage">
            <div id="dice-section">
                <div class="turn-indicator" id="turn-msg" style="font-size:14px; font-weight:bold; color:var(--text-secondary); margin-bottom:5px;">게임 대기 중</div>

                <div class="dice-wrap" id="dice-container">
                    <div class="dice">-</div><div class="dice">-</div><div class="dice">-</div><div class="dice">-</div><div class="dice">-</div>
                </div>
                <button class="btn-primary" id="btn-roll" onclick="Core.sendAction({actionType:'ROLL'})" style="margin-top:10px; padding: 5px 20px;" disabled>
                    굴리기 (<span id="roll-cnt">3</span>)
                </button>
            </div>

            <div id="score-section">
                <table class="score-table">
                    <thead>
                    <tr>
                        <th style="width:40%;">족보</th>
                        <th id="score-header-name">점수</th>
                    </tr>
                    </thead>
                    <tbody id="score-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div id="sidebar-wrapper">

            <div id="player-list-box">
                <div class="panel-header">플레이어 목록</div>
                <div id="user-list-area"></div>
            </div>

            <div id="right-panel">
                <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-color);">
                    <span>채팅</span>
                    <button id="mobile-chat-close-btn" onclick="Core.toggleChat()">❌</button>
                </div>

                <div id="chat-area">
                    <div id="messages"></div>

                    <div class="msg-input-box">
                        <button class="btn-default" onclick="Core.openImageModal()" style="padding: 0 8px; margin-right:5px;" title="이미지 전송">
                            <i class="fas fa-images"></i>
                        </button>
                        <input type="text" id="chatInput" placeholder="입력..." onkeypress="if(event.key==='Enter') Core.sendChat()">
                        <button class="btn-primary" onclick="Core.sendChat()">전송</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="image-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; display:flex; justify-content:center; align-items:center;">
            <div class="box" style="width: 500px; height: 600px; display:flex; flex-direction:column; background:var(--box-bg); padding:0; margin:0;">

                <div style="padding:15px; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                    <div style="display:flex; align-items:center; gap: 15px;">
                        <strong style="font-size: 1.1em;">이미지 갤러리</strong>

                        <label style="cursor: pointer; user-select: none; font-size: 13px; color: var(--text-secondary); display:flex; align-items:center; white-space: nowrap;">
                            <input type="checkbox" id="starFilterCheckbox" onchange="Core.loadImages()" style="margin-right: 5px;">
                            <span>★ 즐겨찾기만</span>
                        </label>
                    </div>

                    <button onclick="Core.closeImageModal()" style="background:none; border:none; color:var(--text-primary); cursor:pointer; font-size:1.5em; line-height:1;">&times;</button>
                </div>

                <div style="padding:15px; border-bottom:1px solid var(--border-color); background:rgba(0,0,0,0.02);">
                    <div style="display:flex; gap:5px; margin-bottom:10px;">
                        <input type="text" id="linkInput" placeholder="이미지 주소(URL) 붙여넣기" style="flex:1; padding:8px; border:1px solid var(--border-color); border-radius:4px;">
                        <button class="btn-primary" onclick="Core.addExternalLink()" style="width:80px;">등록</button>
                    </div>

                    <input type="file" id="uploadInput" accept="image/*" style="display:none;" onchange="Core.uploadFile(this)">
                    <button class="btn-default" onclick="document.getElementById('uploadInput').click()" style="width:100%; padding:8px; border:1px dashed var(--text-secondary); color: var(--text-secondary);">
                        <i class="fas fa-plus"></i> 내 컴퓨터에서 업로드
                    </button>
                </div>

                <div id="gallery-area" style="flex:1; padding:15px; overflow-y:auto; background: var(--box-bg);">
                    <div id="server-img-list" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px;">
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div id="ranking-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:999;">
    <div class="box" style="width:300px; text-align: center; padding-bottom:20px; margin: 0;">
        <div class="box-header">🏆 게임 종료</div>
        <div style="padding: 20px;">
            <h2 id="winnerName" style="color:#2da44e; margin:0;">WINNER</h2>
            <p style="color:#666;">승리를 축하합니다!</p>
        </div>
        <button class="btn-primary" onclick="Core.closeRanking()">나가기</button>
    </div>
</div>
<div id="leaderboard-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:2000;">
    <div class="box" style="width:400px; margin: 0; display:flex; flex-direction:column; max-height:80vh;">
        <div class="box-header" style="display:flex; justify-content:space-between; align-items:center; background: #ffd43b; color: #333;">
            <span>🏆 TOP 5 명예의 전당</span>
            <button onclick="Core.closeLeaderboard()" style="background:none; border:none; color:#333; font-size:16px; cursor:pointer;">&times;</button>
        </div>
        <div style="padding:10px;">
            <table class="score-table" style="width:100%;">
                <thead>
                <tr>
                    <th style="width:15%; text-align:center;">순위</th>
                    <th style="text-align:left;">닉네임</th>
                    <th style="width:25%; text-align:right;">점수</th>
                </tr>
                </thead>
                <tbody id="ranking-list-body">
                </tbody>
            </table>
        </div>
        <div style="padding:16px; border-top: 1px solid var(--border-color); text-align:center;">
            <button class="btn-primary" onclick="Core.closeLeaderboard()" style="width: 100%;">닫기</button>
        </div>
    </div>
</div>
<div id="alert-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:10000;">
    <div class="box" style="width:320px; margin: 0;">
        <div class="box-header">알림</div>
        <div style="padding: 20px; text-align: center;"><p id="alert-msg-text" style="margin:0;">메시지</p></div>
        <div style="padding:16px; border-top: 1px solid var(--border-color);">
            <button class="btn-primary" onclick="Core.closeAlert()" style="width: 100%;">확인</button>
        </div>
    </div>
</div>

<div id="confirm-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; justify-content:center; align-items:center; z-index:10000;">
    <div class="box" style="width:320px; margin: 0;">
        <div class="box-header">확인</div>
        <div style="padding: 20px; text-align: center;"><p id="confirm-msg-text" style="margin:0;">진행?</p></div>
        <div style="padding:16px; border-top: 1px solid var(--border-color); display:flex; gap:10px;">
            <button class="btn-default" onclick="Core.closeConfirm()" style="flex:1;">취소</button>
            <button class="btn-primary" onclick="Core.confirmOk()" style="flex:1;">확인</button>
        </div>
    </div>
</div>
<script src="/Yacht_Dice/js/game-core.js"></script>
<script src="/Yacht_Dice/js/yacht.js"></script>
</body>
</html>
